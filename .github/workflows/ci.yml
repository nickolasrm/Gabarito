name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      # Pages runs Jekyll unless this file is present, and Jekyll would drop
      # underscore-prefixed asset directories (decision 0001).
      - run: touch dist/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: static-bundle
          path: dist
          retention-days: 7
