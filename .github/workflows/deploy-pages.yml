name: Deploy to GitHub Pages

# Manual, and deliberately not triggered on push.
#
# GitHub Pages for a *private* repository requires a paid plan. On the free plan the
# repository has to be public, or the hosting constraint in decision 0001 has to change.
# Until one of those is true, this workflow would fail on every push and CI would always
# look broken, so it runs only when asked.
#
# Before running: Settings -> Pages -> Source: GitHub Actions.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
